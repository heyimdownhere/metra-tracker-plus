# Weekly pull requests for newer versions: Python packages (requirements.txt
# and the full lock), the base image, and the GitHub Actions used by CI.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # New Python versions (3.12 -> 3.13 ...) are moved to by hand, after testing.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
