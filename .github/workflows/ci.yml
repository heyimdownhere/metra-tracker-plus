# Day-to-day work happens on feature/* branches, which don't run anything here
# (tests are run locally before pushing). A run happens when:
#   - something is merged/pushed to main: tests, then the Docker image is built
#     and published to GitHub Container Registry
#     (ghcr.io/heyimdownhere/next-stop) for the server to pull;
#   - a pull request is opened or updated: tests only;
#   - it's started by hand from the Actions tab.
# Docs-only changes (README, TODO, docs/) don't run anything, and a newer push
# cancels a run still in progress for the same branch.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements-lock.txt
      - run: pip install -r requirements-dev.txt -c requirements-lock.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - run: pytest -q

  # Builds the image and starts it, before anything is published: catches a
  # broken Dockerfile or entrypoint, and checks the app doesn't run as root.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: next-stop:ci
          cache-from: type=gha
      - name: Start it and check
        run: |
          mkdir -p appdata && sudo touch appdata/settings.json   # a root-owned file, as older versions left
          docker run -d --name ns -p 8080:8080 -v "$PWD/appdata:/config" \
            -e MAP_DOWNLOAD=false -e CTA_ENABLED=false next-stop:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)
            [ "$code" = 200 ] || [ "$code" = 503 ] && break
            sleep 2
          done
          echo "healthz: $code"; [ "$code" = 200 ] || [ "$code" = 503 ]
          test "$(docker exec ns stat -c %u /proc/1)" = 99
          test "$(stat -c %u appdata/settings.json)" = 99
          curl -sf -o /dev/null -D - http://127.0.0.1:8080/ | grep -i content-security-policy
      - if: failure()
        run: docker logs ns || true

  publish:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/next-stop:latest
            ghcr.io/${{ github.repository_owner }}/next-stop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
